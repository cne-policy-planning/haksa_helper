name: 공휴일 갱신

on:
  schedule:
    - cron: '17 21 * * 0'   # 매주 월요일 오전 6시 17분(한국 시간)
  workflow_dispatch:         # Actions 화면에서 직접 실행할 수 있게

permissions:
  contents: write

concurrency:
  group: holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 공휴일 받아 오기
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: node scripts/fetch-holidays.mjs

      - name: 저장소에 넣기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "공휴일 자료 갱신"
            git push
          fi
